<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LexOS — O sistema operacional completo da oficina</title>
<meta name="description" content="Apresentação navegável do LexOS: operação da oficina, aplicativo do cliente e gestão numa plataforma só. Telas reais do sistema.">
<meta name="theme-color" content="#06070A">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/marca.svg" type="image/svg+xml">
<style>
/* ============================================================
   LexOS — apresentação navegável
   Um slide 16:9 por vez. Teclado, clique, gesto e URL por slide.
   Impressão: um slide por página, sem controles.
   ============================================================ */
:root{
  --void:#06070A; --deep:#090C14; --surf:#0E1524; --surf-2:#141E33;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.16);
  --t1:#EFF3F9; --t2:#98A7BE; --t3:#5E6C84;
  --blue:#3B86F2; --violet:#8B3FE8; --ice:#8FC2FF;
  --grad:linear-gradient(120deg,#3B86F2 0%,#5A5FEA 52%,#8B3FE8 100%);
  --ok:#3ECF77; --warn:#E8B031; --wip:#7C8AA3;
  --sans:'Poppins','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Consolas,monospace;
  --pad:clamp(26px,3.4vw,58px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--t1);font-family:var(--sans);
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
h1,h2,h3{margin:0;letter-spacing:-.025em;line-height:1.06;text-wrap:balance}
p{margin:0}
b,strong{font-weight:600;color:var(--t1)}
button{font-family:inherit}

/* ---------- palco ---------- */
.deck{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:var(--pad) var(--pad) calc(var(--pad) - 6px);
  opacity:0;transform:translateX(26px);pointer-events:none;
  transition:opacity .34s ease,transform .34s ease;
  background:
    radial-gradient(1200px 620px at 88% -12%,rgba(59,134,242,.13),transparent 62%),
    radial-gradient(900px 520px at -8% 108%,rgba(139,63,232,.11),transparent 58%),
    linear-gradient(165deg,var(--void) 0%,var(--deep) 100%);
  overflow-y:auto;overflow-x:hidden;
}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.prev{transform:translateX(-26px)}
@media(prefers-reduced-motion:reduce){.slide{transition:none;transform:none}.slide.prev{transform:none}}

/* ---------- chrome do slide ---------- */
.eyebrow{
  display:inline-flex;align-items:center;gap:11px;flex:none;
  font-family:var(--mono);font-size:clamp(9px,1vw,11px);font-weight:600;letter-spacing:.24em;
  text-transform:uppercase;color:var(--blue);margin-bottom:clamp(9px,1.5vh,16px);
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--blue);flex:none}
h1{font-size:clamp(30px,4.9vw,62px);font-weight:800}
h2{font-size:clamp(21px,3.05vw,40px);font-weight:800;margin-bottom:clamp(6px,1.1vh,12px)}
.lead{font-size:clamp(13px,1.45vw,17px);color:var(--t2);max-width:64ch;line-height:1.6}
.lead b{color:var(--t1)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:clamp(8px,1.4vh,18px) 0}
.cols{display:grid;gap:clamp(16px,2.5vw,38px);align-items:center;min-height:0}
.c-tela{grid-template-columns:1.66fr .95fr}
.c-tela-m{grid-template-columns:.52fr 1fr}
.c2{grid-template-columns:1fr 1fr}

/* ---------- moldura de tela ---------- */
.shot{
  background:var(--surf);border:1px solid var(--line-2);border-radius:14px;
  padding:clamp(6px,.7vw,11px);box-shadow:0 30px 70px -24px rgba(0,0,0,.85);
  overflow:hidden;min-width:0;
}
.shot img{display:block;width:100%;height:auto;border-radius:8px;background:#0B1018;
  max-height:min(61vh,660px);object-fit:contain;object-position:top}
.shot.tall img{max-height:min(61vh,660px)}
.shot.fone{background:transparent;border:none;padding:0;box-shadow:none;text-align:center}
.shot.fone img{
  width:auto;max-width:100%;max-height:min(58vh,560px);margin:0 auto;
  border-radius:20px;border:1px solid var(--line-2);
  box-shadow:0 30px 70px -22px rgba(0,0,0,.9);
}
.cap{font-family:var(--mono);font-size:clamp(9px,.9vw,10.5px);color:var(--t3);
  letter-spacing:.1em;text-transform:uppercase;margin-top:9px;text-align:center}

/* ---------- anotações ---------- */
.notas{display:grid;gap:clamp(8px,1.3vh,14px);min-width:0}
.nota{display:flex;gap:12px;align-items:flex-start}
.nota .n{
  flex:none;width:23px;height:23px;border-radius:7px;background:rgba(59,134,242,.14);
  border:1px solid rgba(59,134,242,.42);color:var(--ice);
  font-family:var(--mono);font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.nota .tx{font-size:clamp(12px,1.22vw,14.5px);color:var(--t2);line-height:1.5}
.nota .tx b{display:block;color:var(--t1);font-weight:600;margin-bottom:1px}

/* ---------- selo de status ---------- */
.selo{
  display:inline-flex;align-items:center;gap:7px;flex:none;align-self:flex-start;
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);color:var(--t2);
  margin-top:clamp(8px,1.4vh,14px);
}
.selo::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.selo.func{color:var(--ok);border-color:rgba(62,207,119,.42);background:rgba(62,207,119,.09)}
.selo.prep{color:var(--warn);border-color:rgba(232,176,49,.42);background:rgba(232,176,49,.09)}
.selo.dep{color:var(--ice);border-color:rgba(59,134,242,.42);background:rgba(59,134,242,.09)}
.selo.plan{color:var(--wip);border-color:var(--line-2)}

/* ---------- blocos genéricos ---------- */
.grid{display:grid;gap:clamp(10px,1.4vw,18px)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:clamp(13px,1.5vw,20px);min-width:0}
.card h3{font-size:clamp(13px,1.35vw,16px);font-weight:700;margin-bottom:6px}
.card p{font-size:clamp(11.5px,1.12vw,13.5px);color:var(--t2);line-height:1.5}
.card .ic{font-size:19px;margin-bottom:7px;display:block}
.card.hi{border-color:rgba(59,134,242,.4);background:linear-gradient(165deg,rgba(59,134,242,.09),var(--surf))}

.lista{display:grid;gap:9px}
.li{display:flex;gap:10px;align-items:flex-start;font-size:clamp(12px,1.2vw,14px);color:var(--t2)}
.li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--blue);margin-top:8px}
.li.neg::before{background:var(--t3)}

/* jornada */
.jornada{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.jp{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px 12px;position:relative}
.jp .k{font-family:var(--mono);font-size:9.5px;color:var(--blue);letter-spacing:.1em}
.jp .v{font-size:clamp(11px,1.05vw,13px);font-weight:600;margin-top:3px;line-height:1.3}
.jp .w{font-size:10.5px;color:var(--t3);margin-top:3px;line-height:1.35}

/* matriz de status */
table.mx{width:100%;border-collapse:collapse;font-size:clamp(11px,1.1vw,13.5px)}
table.mx th,table.mx td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.mx thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--t3);background:rgba(255,255,255,.02)}
table.mx td:first-child{font-weight:600;color:var(--t1);white-space:nowrap}
table.mx td .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px;border-radius:14px;border:1px solid var(--line-2);color:var(--t2);white-space:nowrap}
.st.ok{color:var(--ok);border-color:rgba(62,207,119,.42);background:rgba(62,207,119,.09)}
.st.pr{color:var(--warn);border-color:rgba(232,176,49,.42);background:rgba(232,176,49,.09)}
.st.dp{color:var(--ice);border-color:rgba(59,134,242,.42);background:rgba(59,134,242,.09)}
.rolam{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* arquitetura */
.arq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(10px,1.3vw,16px);align-items:stretch}
.arq .camada{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:7px}
.arq .camada h4{margin:0;font-size:clamp(11.5px,1.15vw,13.5px);font-weight:700}
.arq .camada .cx{font-family:var(--mono);font-size:10.5px;color:var(--t2);
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.arq .camada.mid{border-color:rgba(59,134,242,.4);background:linear-gradient(165deg,rgba(59,134,242,.1),var(--surf))}

/* capa */
.capa{align-items:center;justify-content:center;text-align:center}
.capa .marca{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:clamp(16px,2.6vh,28px)}
.capa .marca svg{width:clamp(40px,4.4vw,58px);height:auto}
.capa .wm{font-size:clamp(28px,3.5vw,44px);font-weight:800;letter-spacing:-.035em}
.capa .wm .a{color:var(--t1)} .capa .wm .b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.capa .by{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--t3);text-transform:uppercase;margin-top:5px}
.capa h1{max-width:20ch;margin:0 auto}
.capa .sub{margin-top:clamp(12px,2vh,20px);font-size:clamp(13px,1.5vw,18px);color:var(--t2);max-width:52ch;margin-left:auto;margin-right:auto}
.capa .fita{display:flex;gap:clamp(10px,1.4vw,20px);justify-content:center;margin-top:clamp(20px,3.4vh,38px);flex-wrap:wrap}
.capa .fita img{height:clamp(120px,19vh,200px);width:auto;border-radius:11px;border:1px solid var(--line-2);
  box-shadow:0 26px 56px -22px rgba(0,0,0,.9)}
.capa .fita img.f{border-radius:16px}

/* ---------- controles ---------- */
.barra{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06);z-index:30}
.barra i{display:block;height:100%;background:var(--grad);width:0;transition:width .34s ease}
.hud{position:fixed;right:14px;bottom:14px;z-index:32;display:flex;align-items:center;gap:7px}
.hud button,.menu-btn{
  background:rgba(14,21,36,.86);border:1px solid var(--line-2);color:var(--t2);
  border-radius:10px;min-width:38px;height:38px;padding:0 11px;cursor:pointer;font-size:14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:inline-flex;align-items:center;justify-content:center;
}
.hud button:hover,.menu-btn:hover{color:var(--t1);border-color:var(--blue)}
.hud .cont{font-family:var(--mono);font-size:11px;color:var(--t3);padding:0 10px;
  height:38px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;
  background:rgba(14,21,36,.86);white-space:nowrap}
.hud .cont b{color:var(--t1);font-weight:600}
.menu-btn{position:fixed;left:14px;bottom:14px;z-index:32;gap:8px;font-size:12px;font-weight:600}
.cap-atual{position:fixed;left:14px;top:14px;z-index:31;font-family:var(--mono);font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--t3);
  background:rgba(14,21,36,.7);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:calc(100vw - 28px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zona{position:fixed;top:0;bottom:56px;width:12vw;z-index:20;cursor:pointer;background:transparent;border:none}
.zona.e{left:0} .zona.d{right:0}

/* sumário */
.sumario{position:fixed;inset:0;z-index:60;background:rgba(6,7,10,.96);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  display:none;overflow-y:auto;padding:clamp(22px,4vw,54px)}
.sumario.on{display:block}
.sumario h2{margin-bottom:clamp(14px,2.4vh,26px)}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:clamp(14px,2vw,26px)}
.sum-cap{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--blue);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sum-grid ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sum-grid button{
  display:flex;gap:10px;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  color:var(--t2);font-size:13px;padding:6px 8px;border-radius:8px;line-height:1.35;
}
.sum-grid button:hover{background:rgba(255,255,255,.05);color:var(--t1)}
.sum-grid button[aria-current="true"]{color:var(--ice);background:rgba(59,134,242,.1)}
.sum-grid button .num{font-family:var(--mono);font-size:10.5px;color:var(--t3);flex:none;padding-top:2px}
.fechar{position:fixed;right:16px;top:16px;z-index:61}

:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

/* ---------- celular ---------- */
@media (max-width:860px){
  .cols,.c-tela,.c-tela-m,.c2{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .jornada{grid-template-columns:repeat(2,1fr)}
  .arq{grid-template-columns:1fr}
  .slide{padding:54px 18px 62px}
  .shot img{max-height:34vh}
  .shot.fone img{max-height:44vh}
  .capa .fita img{height:22vh}
  .zona{width:22vw}
  .hud .cont{display:none}
}
@media (max-width:620px){ .g3,.g4{grid-template-columns:1fr} }

/* ---------- impressão / PDF ---------- */
@media print{
  @page{size:297mm 167mm;margin:0}
  html,body{overflow:visible;background:#fff}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .deck{height:auto;overflow:visible}
  .slide{
    position:relative;inset:auto;opacity:1!important;transform:none!important;pointer-events:auto;
    width:297mm;height:167mm;page-break-after:always;break-after:page;overflow:hidden;padding:14mm;
  }
  .slide:last-child{page-break-after:auto;break-after:auto}
  .hud,.menu-btn,.barra,.zona,.sumario,.cap-atual,.fechar{display:none!important}
  .shot img{max-height:74mm}
  .shot.fone img{max-height:92mm}
  .capa .fita img{height:52mm}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="lg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3B86F2"/><stop offset=".5" stop-color="#5A5FEA"/><stop offset="1" stop-color="#8B3FE8"/>
  </linearGradient>
  <symbol id="xm" viewBox="0 0 64 64">
    <path d="M55 7 L41 7 L9 57 L23 57 Z" fill="url(#lg)"/>
    <path d="M32 32 L40 44 L28 46 Z" fill="#0B1330" opacity=".22"/>
    <path d="M9 7 L23 7 L55 57 L41 57 Z" fill="url(#lg)"/>
  </symbol>
</defs></svg>

<main class="deck" id="deck" aria-label="Apresentação LexOS"></main>

<div class="cap-atual" id="capAtual" aria-live="polite"></div>
<button class="menu-btn" id="btnMenu" aria-label="Abrir sumário (M)"><span aria-hidden="true">☰</span> Sumário</button>
<div class="hud">
  <span class="cont" id="cont" aria-live="polite"></span>
  <button id="btnPrev" aria-label="Slide anterior (seta esquerda)">←</button>
  <button id="btnNext" aria-label="Próximo slide (seta direita)">→</button>
  <button id="btnFull" aria-label="Tela cheia (F)">⛶</button>
</div>
<button class="zona e" id="zonaE" aria-label="Slide anterior" tabindex="-1"></button>
<button class="zona d" id="zonaD" aria-label="Próximo slide" tabindex="-1"></button>
<div class="barra"><i id="prog"></i></div>

<section class="sumario" id="sumario" role="dialog" aria-modal="true" aria-label="Sumário">
  <button class="hud fechar" style="position:fixed" id="btnFechar" aria-label="Fechar sumário (Esc)">
    <button aria-hidden="true" tabindex="-1">✕</button>
  </button>
  <h2>Sumário</h2>
  <div class="sum-grid" id="sumGrid"></div>
</section>

<script>
/* ============================================================
   Conteúdo — cada item vira um slide. `cap` agrupa em capítulos.
   Toda afirmação de status usa um dos quatro selos:
     func = funcional na demonstração
     prep = estrutura preparada
     dep  = depende de integração externa
     plan = planejado no roadmap
   ============================================================ */
const T = 'assets/telas/';
const marca = '<span class="marca"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#xm"/></svg>'
  + '<span><span class="wm"><span class="a">Lex</span><span class="b">OS</span></span>'
  + '<span class="by">por Lex Technology</span></span></span>';

const tela = (arq, alt, cap) =>
  `<figure class="shot"><img src="${T}${arq}.webp" alt="${alt}" loading="lazy" decoding="async">
   <figcaption class="cap">${cap}</figcaption></figure>`;
const fone = (arq, alt, cap) =>
  `<figure class="shot fone"><img src="${T}${arq}.webp" alt="${alt}" loading="lazy" decoding="async">
   <figcaption class="cap">${cap}</figcaption></figure>`;
const notas = (arr) => `<div class="notas">${arr.map((n, i) =>
  `<div class="nota"><span class="n">${i + 1}</span><span class="tx">${n}</span></div>`).join('')}</div>`;
const selo = (t, txt) => `<span class="selo ${t}">${txt}</span>`;

// Slide de tela: título + o que resolve + captura + destaques numerados + status.
function slideTela(o) {
  const img = o.fone ? fone(o.arq, o.alt, o.cap) : tela(o.arq, o.alt, o.cap);
  return {
    cap: o.capitulo, titulo: o.titulo,
    html: `<span class="eyebrow">${o.modulo}</span>
      <h2>${o.titulo}</h2>
      <p class="lead">${o.lead}</p>
      <div class="body"><div class="cols ${o.fone ? 'c-tela-m' : 'c-tela'}">
        ${img}
        <div>${notas(o.notas)}${selo(o.selo[0], o.selo[1])}</div>
      </div></div>`,
  };
}

const SLIDES = [

/* ===== CAPÍTULO 1 — VISÃO ===== */
{ cap:'Visão do produto', titulo:'Capa', classe:'capa', html:
  `${marca}
   <h1>O sistema operacional completo da oficina.</h1>
   <p class="sub">Operação, aplicativo do cliente e gestão na mesma plataforma — sobre uma única ordem de serviço.</p>
   <div class="fita">
     <img src="${T}painel-quadro.webp" alt="Quadro da oficina no LexOS" fetchpriority="high">
     <img class="f" src="${T}app-inicio.webp" alt="Aplicativo do cliente no LexOS" fetchpriority="high">
   </div>` },

{ cap:'Visão do produto', titulo:'A oficina opera em sistemas desconectados', html:
  `<span class="eyebrow">O problema</span>
   <h2>A oficina opera em sistemas desconectados</h2>
   <p class="lead">Cada etapa vive num lugar diferente — e o que liga tudo é a memória de quem está no balcão.</p>
   <div class="body"><div class="grid g3">
     <div class="card"><span class="ic">💬</span><h3>Atendimento espalhado</h3>
       <p>Agendamento por telefone, aprovação por áudio, foto no álbum do celular. Nada disso vira histórico consultável.</p></div>
     <div class="card"><span class="ic">📄</span><h3>Documento que não existe</h3>
       <p>Sem termo de entrada com foto e assinatura, a discussão sobre um risco preexistente vira palavra contra palavra.</p></div>
     <div class="card"><span class="ic">🔍</span><h3>Cliente no escuro</h3>
       <p>Quem deixou o carro não sabe em que etapa ele está, e liga para descobrir — o que consome a recepção.</p></div>
     <div class="card"><span class="ic">🧾</span><h3>Orçamento tudo-ou-nada</h3>
       <p>O cliente aprova ou recusa um bloco inteiro. O que ele adiaria em vez de recusar se perde.</p></div>
     <div class="card"><span class="ic">📊</span><h3>Número só no fim do mês</h3>
       <p>Margem por ordem de serviço, comissão por técnico e curva de peças ficam numa planilha à parte, ou em lugar nenhum.</p></div>

{ cap:'Documentos e controle', titulo:'Trilha de eventos', html:
  `<span class="eyebrow">Rastreabilidade</span>
   <h2>Cada passo deixa rastro — e o rastro não se apaga</h2>
   <p class="lead">A trilha de eventos é somente-adição: registros são inseridos, nunca editados ou removidos.
     É a base da comprovação de quem aprovou o quê, e quando.</p>
   <div class="body"><div class="cols c2">
     <div class="grid" style="gap:10px">
       <div class="card"><h3>O que fica registrado</h3>
         <p>Abertura da OS, mudança de etapa, envio do orçamento, aprovação e recusa item a item,
            execução, controle de qualidade, pagamento e entrega — com autor, data e hora.</p></div>
       <div class="card"><h3>Como é protegido</h3>
         <p>No banco, uma regra bloqueia alteração e exclusão na tabela de eventos. A exclusão deliberada de
            uma oficina inteira passa por um procedimento próprio, com permissão de administrador.</p></div>
     </div>
     <div class="grid" style="gap:10px">
       <div class="card"><h3>O que isso dá à oficina</h3>
         <p>Diante de uma contestação, existe um registro de quando o cliente viu, o que ele aprovou e em qual
            versão do orçamento — em vez de memória e captura de tela.</p></div>
       <div class="card"><h3>O que isso não é</h3>
         <p>Não é assinatura digital com certificado ICP-Brasil nem substitui laudo pericial.
            É estrutura de rastreabilidade e comprovação do aceite.</p></div>
     </div>
   </div></div>
   ${selo('func','Trilha imutável funcional · validada no banco')}` },

{ cap:'Tecnologia e segurança', titulo:'Arquitetura', html:
  `<span class="eyebrow">Arquitetura</span>
   <h2>Duas interfaces, uma base de dados</h2>
   <p class="lead">Não existe sincronização entre sistemas porque não existem dois sistemas.</p>

     <div class="camada"><h4>Quem usa</h4>
       <div class="cx">Painel da oficina</div>

       <div class="cx">Documentos para impressão</div></div>

       <div class="cx">Modelo de dados único (ordem de serviço)</div>
       <div class="cx">Adaptador local ⇄ nuvem</div>
       <div class="cx">Atualização em tempo real entre telas</div>
       <div class="cx">Funções de servidor para o que é segredo</div></div>
     <div class="camada"><h4>Infraestrutura</h4>
       <div class="cx">Banco relacional com isolamento por oficina</div>
       <div class="cx">Autenticação e sessão</div>
       <div class="cx">Canal de tempo real</div>
       <div class="cx">Publicação estática + funções sob demanda</div></div>

   <p class="lead" style="margin-top:clamp(12px,2.2vh,20px)">
     O mesmo código roda <b>sem nuvem</b> (demonstração local, dados fictícios no navegador) e
     <b>com nuvem</b> (multiempresa, isolado por oficina) — a troca é de configuração, não de versão.</p>
   </div>` },

{ cap:'Tecnologia e segurança', titulo:'Segurança por arquitetura', html:
  `<span class="eyebrow">Segurança</span>
   <h2>O isolamento é regra do banco, não do aplicativo</h2>
   <p class="lead">Uma oficina não consegue ler o dado de outra mesmo que a interface peça — a regra está uma camada abaixo.</p>
   <div class="body"><div class="grid g3">
     <div class="card"><h3>Isolamento por oficina</h3><p>Cada linha pertence a uma oficina, e a política do banco filtra por quem está autenticado. Nenhuma consulta escapa disso.</p></div>
     <div class="card"><h3>Papéis e permissões</h3><p>Equipe vinculada à oficina, com função. Sem vínculo, a conta não abre o painel, mesmo autenticada.</p></div>
     <div class="card"><h3>Segredos no servidor</h3><p>Chaves de API e a chave de serviço vivem em variáveis de ambiente da função, nunca no navegador nem no repositório.</p></div>
     <div class="card"><h3>Acesso do cliente</h3><p>Convite com token, senha criada pelo próprio cliente e recuperação por link — a oficina nunca guarda a senha dele.</p></div>
     <div class="card"><h3>Biometria local</h3><p>A credencial fica cifrada no aparelho; onde o autenticador suporta, a chave da cifra vem da própria biometria.</p></div>
     <div class="card"><h3>Trilha somente-adição</h3><p>Regra no banco impede alterar ou apagar evento registrado.</p></div>
   </div></div>

/* ============================================================
   Motor da apresentação
   ============================================================ */
const deck = document.getElementById('deck');
const sumGrid = document.getElementById('sumGrid');
const sumario = document.getElementById('sumario');
const prog = document.getElementById('prog');
const cont = document.getElementById('cont');
const capAtual = document.getElementById('capAtual');
let i = 0;

SLIDES.forEach((s, n) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.classe ? ' ' + s.classe : '');
  el.id = 's' + (n + 1);
  el.setAttribute('role', 'group');
  el.setAttribute('aria-roledescription', 'slide');
  el.setAttribute('aria-label', `${n + 1} de ${SLIDES.length} — ${s.titulo}`);
  el.innerHTML = s.html;
  deck.appendChild(el);
});

// Sumário agrupado por capítulo
const caps = [];
SLIDES.forEach((s, n) => {
  let c = caps.find(x => x.nome === s.cap);
  if (!c) { c = { nome: s.cap, itens: [] }; caps.push(c); }
  c.itens.push({ n, titulo: s.titulo });
});
sumGrid.innerHTML = caps.map(c =>
  `<div><div class="sum-cap">${c.nome}</div><ol>${c.itens.map(it =>
    `<li><button data-ir="${it.n}"><span class="num">${String(it.n + 1).padStart(2, '0')}</span>
      <span>${it.titulo}</span></button></li>`).join('')}</ol></div>`).join('');

const slides = [...deck.children];
const sumBtns = [...sumGrid.querySelectorAll('button[data-ir]')];

function mostrar(n, comHash) {
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  slides.forEach((el, k) => {
    el.classList.toggle('on', k === n);
    el.classList.toggle('prev', k < n);
    el.setAttribute('aria-hidden', k === n ? 'false' : 'true');
  });
  sumBtns.forEach((b, k) => b.setAttribute('aria-current', k === n ? 'true' : 'false'));
  i = n;
  prog.style.width = ((n + 1) / SLIDES.length * 100) + '%';
  cont.innerHTML = `<b>${n + 1}</b>&nbsp;/&nbsp;${SLIDES.length}`;
  capAtual.textContent = SLIDES[n].cap;
  document.title = `${SLIDES[n].titulo} — LexOS`;
  if (comHash !== false) history.replaceState(null, '', '#s' + (n + 1));
  deck.querySelector('.slide.on').scrollTop = 0;
}
const proximo = () => mostrar(i + 1);
const anterior = () => mostrar(i - 1);

function abrirSumario(v) {
  sumario.classList.toggle('on', v);
  if (v) sumBtns[i] && sumBtns[i].focus();
  else document.getElementById('btnMenu').focus();
}

document.getElementById('btnNext').addEventListener('click', proximo);
document.getElementById('btnPrev').addEventListener('click', anterior);
document.getElementById('zonaD').addEventListener('click', proximo);
document.getElementById('zonaE').addEventListener('click', anterior);
document.getElementById('btnMenu').addEventListener('click', () => abrirSumario(true));
document.getElementById('btnFechar').addEventListener('click', () => abrirSumario(false));
document.getElementById('btnFull').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
sumGrid.addEventListener('click', e => {
  const b = e.target.closest('button[data-ir]');
  if (b) { mostrar(+b.dataset.ir); abrirSumario(false); }
});

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape') { abrirSumario(false); return; }
  if (k === 'm' || k === 'M') { e.preventDefault(); abrirSumario(!sumario.classList.contains('on')); return; }
  if (sumario.classList.contains('on')) return;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); proximo(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); anterior(); }
  else if (k === 'Home') { e.preventDefault(); mostrar(0); }
  else if (k === 'End') { e.preventDefault(); mostrar(SLIDES.length - 1); }
  else if (k === 'f' || k === 'F') { e.preventDefault(); document.getElementById('btnFull').click(); }
});

// Gesto lateral no celular — sem atrapalhar a rolagem vertical do slide.
let tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) (dx < 0 ? proximo : anterior)();
}, { passive: true });

addEventListener('hashchange', () => {
  const n = +(location.hash.match(/^#s(\d+)$/) || [])[1];
  if (n && n - 1 !== i) mostrar(n - 1, false);
});

mostrar(+(location.hash.match(/^#s(\d+)$/) || [])[1] - 1 || 0);
</script>
