<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 212" width="880" height="212" role="img" aria-label="Auto Union Premium — Porsche &amp; Audi">
  <!-- Versão para FUNDO CLARO: usada no cabeçalho dos documentos (termo, orçamento,
       OS, garantia, prontuário), que são impressos em papel branco. Mesmo lockup do
       logo escuro, com a assinatura em grafite no lugar do cromado. -->

  <!-- Monograma (a chapa é escura por definição da marca — funciona sobre branco) -->
  <g transform="translate(30,23) scale(0.52)">
    <g stroke="#8E8B80" stroke-width="8" fill="#1C1B18">
      <rect x="-26" y="-26" width="362" height="272" rx="46"/>
      <rect x="50"  y="66"  width="362" height="272" rx="46"/>
    </g>
    <g fill="#1C1B18">
      <rect x="-26" y="-26" width="362" height="272" rx="46"/>
      <rect x="50"  y="66"  width="362" height="272" rx="46"/>
    </g>
    <g transform="translate(76,92) rotate(180,155,110)">
      <path d="M45,220 L45,45 L265,45 L265,220" fill="none" stroke="#12120F" stroke-width="106" stroke-linejoin="round"/>
      <path d="M45,220 L45,45 L265,45 L265,220" fill="none" stroke="#F1BC45" stroke-width="90" stroke-linejoin="round"/>
    </g>
    <path d="M45,220 L45,45 L265,45 L265,220" fill="none" stroke="#12120F" stroke-width="106" stroke-linejoin="round"/>
    <path d="M45,220 L45,45 L265,45 L265,220" fill="none" stroke="#C23233" stroke-width="90" stroke-linejoin="round"/>
  </g>

  <!-- Assinatura em grafite -->
  <g transform="translate(292,0)" font-family="'Arial Black','Helvetica Neue',Impact,system-ui,sans-serif">
    <g transform="skewX(-11)">
      <text x="20" y="110" textLength="520" lengthAdjust="spacingAndGlyphs"
            font-size="94" font-weight="900" letter-spacing="2" fill="#1F1E1B">AUTO UNION</text>
    </g>
    <text x="4" y="170" textLength="186" lengthAdjust="spacingAndGlyphs"
          font-size="38" font-weight="900" letter-spacing="6" fill="#C23233">PREMIUM</text>
    <text x="212" y="168" textLength="300" lengthAdjust="spacingAndGlyphs"
          font-size="26" font-weight="700" letter-spacing="5" fill="#6B6B66"
          font-family="system-ui,-apple-system,'Segoe UI',sans-serif">PORSCHE &amp; AUDI</text>
  </g>
</svg>
