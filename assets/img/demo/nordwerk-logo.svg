<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" role="img" aria-label="Nordwerk — especialista Porsche e Audi">
  <defs>
    <linearGradient id="nwm" x1="6" y1="8" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0A331"/><stop offset=".55" stop-color="#D8741C"/><stop offset="1" stop-color="#A8481A"/>
    </linearGradient>
  </defs>
  <!-- Marca: o "N" é o gate de câmbio visto de cima — duas verticais e a diagonal
       da passagem. Quem é de oficina reconhece; quem não é, lê a letra. -->
  <g>
    <rect x="8"  y="10" width="10" height="52" rx="3" fill="url(#nwm)"/>
    <rect x="46" y="10" width="10" height="52" rx="3" fill="url(#nwm)"/>
    <path d="M18 10 L28 10 L56 50 L56 62 L46 62 L18 22 Z" fill="url(#nwm)"/>
    <circle cx="13" cy="36" r="3.1" fill="#0B0D12" opacity=".55"/>
    <circle cx="51" cy="36" r="3.1" fill="#0B0D12" opacity=".55"/>
  </g>
  <text x="74" y="40" font-family="Poppins,'Segoe UI',system-ui,sans-serif" font-size="27" font-weight="800" letter-spacing="-.8" fill="#F2F4F8">NORDWERK</text>
  <text x="75" y="57" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="9.2" letter-spacing="3.1" fill="#9AA6BA">PORSCHE &amp; AUDI</text>
</svg>
